name: Splick

# Per-developer signing (Team ID). Copy project.local.yml.example → project.local.yml
include:
  - path: project.local.yml
    optional: true

options:
  bundleIdPrefix: com.splick
  developmentLanguage: vi
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false
  # Keep local SPM packages under Package Dependencies only — avoids "Couldn't load project" folder refs.
  localPackagesGroup: ""
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: vi
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: 3
    # DEVELOPMENT_TEAM: set in project.local.yml (see project.local.yml.example)
    CODE_SIGN_STYLE: Automatic
    ONLY_ACTIVE_ARCH: YES
    # Apple Silicon simulators are arm64-only; avoid x86_64 SplickApp vs arm64 SPM mismatch
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  SplickCore:
    path: Packages/SplickCore
  SplickDomain:
    path: Packages/SplickDomain
  FeatureAuth:
    path: Packages/FeatureAuth
  FeatureSocialFeed:
    path: Packages/FeatureSocialFeed
  FeatureMedia:
    path: Packages/FeatureMedia
  FeatureExpense:
    path: Packages/FeatureExpense
  FeatureNotification:
    path: Packages/FeatureNotification
  FeatureFriends:
    path: Packages/FeatureFriends
  FeatureMessaging:
    path: Packages/FeatureMessaging
  FeatureStickers:
    path: Packages/FeatureStickers
  SimulationKit:
    path: Packages/SimulationKit
  SplickWidgetKit:
    path: Packages/SplickWidgetKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  SplickApp:
    type: application
    platform: iOS
    sources:
      - path: SplickApp/Sources
      - path: SplickApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: SplickApp/Resources/en.lproj
        buildPhase: resources
      - path: SplickApp/Resources/vi.lproj
        buildPhase: resources
      - path: SplickApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: SplickCore
        product: Networking
      - package: SplickCore
        product: Storage
      - package: SplickCore
        product: DesignSystem
      - package: SplickCore
        product: Common
      - package: SplickCore
        product: Localization
      - package: SplickDomain
        product: SplickDomain
      - package: FeatureAuth
        product: FeatureAuth
      - package: FeatureSocialFeed
        product: FeatureSocialFeed
      - package: FeatureMedia
        product: FeatureMedia
      - package: FeatureExpense
        product: FeatureExpense
      - package: FeatureNotification
        product: FeatureNotification
      - package: FeatureFriends
        product: FeatureFriends
      - package: FeatureMessaging
        product: FeatureMessaging
      - package: FeatureStickers
        product: FeatureStickers
      - package: SimulationKit
        product: SimulationKit
      - package: SplickWidgetKit
        product: SplickWidgetKit
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: SplickWidgetExtension
        embed: true
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_NAME: SplickApp
        # Xcode 26 debug dylib can abort during dyld/xpc init (before main). Framework Previews still work.
        ENABLE_DEBUG_DYLIB: NO
        INFOPLIST_FILE: SplickApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.splick.app
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        KLIPY_API_KEY: ""
      configs:
        Debug:
          APS_ENVIRONMENT: development
          CODE_SIGN_ENTITLEMENTS: SplickApp/SplickApp.entitlements
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_ENTITLEMENTS: SplickApp/SplickApp.entitlements

  SplickWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "16.0"
    sources:
      - path: SplickWidgetExtension/Sources
    dependencies:
      - package: SplickWidgetKit
        product: SplickWidgetKit
    settings:
      base:
        PRODUCT_NAME: SplickWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.splick.app.widgets
        INFOPLIST_FILE: SplickWidgetExtension/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: SplickWidgetExtension/SplickWidgetExtension.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SplickWidgetExtension/SplickWidgetExtension.entitlements

schemes:
  SplickApp:
    build:
      targets:
        SplickApp: all
        SplickWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Xcode 26 can fail to launch under LLDB (launchd spawn / SBMainWorkspace denied).
  # Use this scheme when ▶ Run fails but the app installs fine via simctl.
  SplickApp-Run:
    build:
      targets:
        SplickApp: all
    run:
      config: Debug
      debugEnabled: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
